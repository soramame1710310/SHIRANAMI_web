<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>白波</title>
  <link rel="stylesheet" href="book.css">
  <link rel="stylesheet" href="appearance.css">
</head>
<body>
  <header>
    <div class="brand"><span class="mark" aria-hidden="true">綴</span><div><span class="eyebrow">TSUZURI / WEB BOOK</span><h1 id="title">白波</h1></div></div>
    <nav aria-label="閲覧操作"><button id="grid-toggle" aria-pressed="false" aria-controls="overview">一覧表示</button><button id="thumb-toggle" aria-expanded="false" aria-controls="thumbs">ページ移動</button><button id="fullscreen">全画面</button></nav>
  </header>
  <main id="viewer" tabindex="0" aria-label="冊子の閲覧画面">
    <div id="stage" aria-live="polite"></div>
    <section id="overview" aria-label="全ページの一覧" hidden>
      <div class="overview-heading"><h2>ページ一覧</h2><p id="overview-summary" aria-live="polite"></p><p>ページをクリックして開く</p></div>
      <div id="page-grid"></div>
    </section>
  </main>
  <button id="restore-ui" aria-label="操作パネルを表示">操作を表示</button>
  <aside id="thumbs" aria-label="ページ一覧" hidden><div class="thumb-heading"><strong>ページ一覧</strong><button id="thumb-close" aria-label="ページ一覧を閉じる">閉じる</button></div><div id="thumb-grid"></div></aside>
  <footer>
    <div id="page-navigation" class="navigation"><button id="previous">前へ</button><output id="position" aria-live="polite"></output><button id="next">次へ</button><input id="seek" type="range" min="0" value="0" aria-label="ページを移動"></div>
    <div class="settings"><label>表示 <select id="mode"><option value="auto">自動</option><option value="single">単ページ</option><option value="spread">見開き</option><option value="grid">一覧</option></select></label><label>拡大 <select id="zoom"><option value="1">全体表示</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option></select></label><label>紙の陰影 <select id="paper"><option value="natural">自然</option><option value="soft">控えめ</option><option value="flat">なし</option></select></label><span id="view-hint" class="hint">中央をタップで操作を隠す</span><button id="hide-ui">誌面に集中</button></div>
  </footer>
  <noscript>ページをめくるにはJavaScriptを有効にしてください。誌面画像は pages フォルダーに保存されています。</noscript>
  <script src="book-data.js"></script><script src="book.js"></script>
</body>
</html>
