
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>白波</title>
    <style>
        :root {
            /* Pythonから注入されるCSS変数 */
            --bg-color: #121212;
            --text-color: #eeeeee;
            --ui-bg-color: #1e1e1e;     /* ヘッダー・フッター背景 */
            --accent-color: #104585;   /* ボタン・スライダー色 */
            --font-family: "Times New Roman", "YuMincho", "Hiragino Mincho ProN", serif;     /* フォント */
            --shadow-opacity: 0.1; /* 影の濃さ (0.0 ~ 1.0) */
        }

        body { 
            margin: 0; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: var(--font-family); 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        /* Header */
        #app-header { 
            height: 44px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 20px; 
            background: var(--ui-bg-color);
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            z-index: 10;
        }
        .app-title { font-weight: bold; color: var(--accent-color); font-size: 16px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

        /* Main Viewer */
        #viewer-container { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; padding: 20px; }
        
        #spread-view { 
            display: flex; 
            box-shadow: 0 10px 40px rgba(0,0,0, calc(var(--shadow-opacity) + 0.2)); /* 全体の影も連動 */
            transition: opacity 0.2s; 
            max-width: 100%; 
            max-height: 100%; 
        }
        
        .page { position: relative; background: white; overflow: hidden; box-sizing: border-box; }
        
        /* ページ中央の影 (リアリティ演出) */
        .page-shadow { 
            position: absolute; top: 0; bottom: 0; width: 100%; height: 100%; 
            box-shadow: inset 0 0 40px rgba(0,0,0, var(--shadow-opacity)); 
            pointer-events: none; z-index: 100; 
        }
        
        /* Layout Items */
        .photo-slot { 
            position: absolute; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: transparent;
        }
        
        .photo-img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            display: block;
        }
        
        .text-item { position: absolute; transform: translate(-50%, -50%); white-space: pre-wrap; pointer-events: none; line-height: 1.4; }
        .page-num { position: absolute; bottom: 8px; width: 100%; text-align: center; opacity: 0.6; font-size: 10px; pointer-events: none; font-family: monospace; color: inherit; }

        /* Controls Footer */
        #controls { 
            height: auto;
            min-height: 60px;
            background: var(--ui-bg-color); 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            gap: 10px; 
            padding: 10px 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
        }

        .nav-row { display: flex; align-items: center; gap: 15px; width: 100%; max-width: 600px; justify-content: center; }
        
        /* Slider Styling */
        input[type=range] {
            -webkit-appearance: none; width: 100%; background: transparent; cursor: pointer;
        }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 6px; background: rgba(128,128,128,0.3); border-radius: 3px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; 
            background: var(--accent-color); margin-top: -5px; box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }
        
        /* Buttons */
        .btn { 
            background: transparent; 
            color: var(--text-color); 
            border: 1px solid var(--text-color); 
            padding: 6px 16px; cursor: pointer; border-radius: 4px; font-size: 14px; transition: all 0.2s; min-width: 80px; 
            opacity: 0.8;
        }
        .btn:hover { 
            background: var(--accent-color); 
            border-color: var(--accent-color); 
            color: #fff; /* Hover時は白文字固定 */
            opacity: 1.0;
        }
        
        /* Select Box */
        #page-select {
            background: rgba(0,0,0,0.1); 
            color: var(--text-color); 
            border: 1px solid rgba(128,128,128,0.3);
            padding: 5px; border-radius: 4px; font-size: 14px;
        }
        #page-select option { background: #333; color: white; }

        @media (max-width: 600px) {
            #app-header { display: none; }
            #controls { padding-bottom: 20px; }
        }
    </style>
</head>
<body>

<div id="app-header">
    <div class="app-title">白波</div>
    <select id="page-select" onchange="jumpToPage(this.value)"></select>
</div>

<div id="viewer-container">
    <div id="spread-view"></div>
</div>

<div id="controls">
    <!-- Seekbar -->
    <div class="nav-row">
        <span style="font-size:12px; width:30px; text-align:right;" id="lbl-current">1</span>
        <input type="range" id="seek-bar" min="0" max="10" value="0" oninput="onSeek(this.value)">
        <span style="font-size:12px; width:30px;" id="lbl-total">10</span>
    </div>
    
    <!-- Buttons -->
    <div class="nav-row">
        <button class="btn" onclick="prevSpread()">◀ PREV</button>
        <button class="btn" onclick="nextSpread()">NEXT ▶</button>
    </div>
</div>

ng_mm": 0.0, "background_color": "#FFFFFF", "photos": [{"path": "assets/30039_裏.png.jpg", "slot_index": 0, "rotation": 0, "crop": {"left": 0.0, "top": 0.0, "right": 1.0, "bottom": 1.0}}], "texts": [], "custom_margins": {"top": 0.0, "bottom": 0.0, "inner": 0.0, "outer": 0.0}}, {"layout_name": "1枚 (全面)", "spacing_mm": 0.0, "background_color": "#FFFFFF", "photos": [{"path": "assets/69094_裏表紙.png.jpg", "slot_index": 0, "rotation": 0, "crop": {"left": 0.0, "top": 0.0, "right": 1.0, "bottom": 1.0}}], "texts": [], "custom_margins": {"top": 0.0, "bottom": 0.0, "inner": 0.0, "outer": 0.0}}], "current_spread_index": 1};
    const LAYOUT_DEFS = {"1枚 (全面)": [[0.0, 0.0, 1.0, 1.0]], "1枚 (中央)": [[0.1, 0.1, 0.8, 0.8]], "2枚 (縦並び)": [[0.0, 0.0, 1.0, 0.5], [0.0, 0.5, 1.0, 0.5]], "2枚 (横並び)": [[0.0, 0.0, 0.5, 1.0], [0.5, 0.0, 0.5, 1.0]], "3枚 (分割)": [[0.0, 0.0, 1.0, 0.5], [0.0, 0.5, 0.5, 0.5], [0.5, 0.5, 0.5, 0.5]], "4枚 (グリッド)": [[0.0, 0.0, 0.5, 0.5], [0.5, 0.0, 0.5, 0.5], [0.0, 0.5, 0.5, 0.5], [0.5, 0.5, 0.5, 0.5]], "6枚 (グリッド)": [[0.0, 0.0, 0.5, 0.333], [0.5, 0.0, 0.5, 0.333], [0.0, 0.333, 0.5, 0.333], [0.5, 0.333, 0.5, 0.333], [0.0, 0.666, 0.5, 0.333], [0.5, 0.666, 0.5, 0.333]]};
    const PAPER_SIZES = {"A0": [841, 1189], "A1": [594, 841], "A2": [420, 594], "A3": [297, 420], "A4": [210, 297], "A5": [148, 210], "A6": [105, 148], "B4": [257, 364], "B5": [182, 257], "Hagaki": [100, 148], "L-Size": [89, 127], "2L-Size": [127, 178]};
    const IS_COVER_MODE = true;

    let currentSpreadIndex = 0;
    
    const paperKey = PROJECT_DATA.paper_size in PAPER_SIZES ? PROJECT_DATA.paper_size : "A4";
    let [pw, ph] = PAPER_SIZES[paperKey];
    if (PROJECT_DATA.orientation === "Landscape") [pw, ph] = [ph, pw];

    function init() {
        initNavigation();
        renderSpread();
        window.addEventListener('resize', renderSpread);
        window.addEventListener('keydown', (e) => {
            if(e.key === "ArrowLeft") prevSpread();
            if(e.key === "ArrowRight") nextSpread();
        });
    }

    function getTotalSpreads() {
        const totalPages = PROJECT_DATA.pages.length;
        if (!IS_COVER_MODE) return Math.ceil(totalPages / 2);
        return 1 + Math.ceil((totalPages - 1) / 2);
    }

    function initNavigation() {
        const total = getTotalSpreads();
        const slider = document.getElementById('seek-bar');
        slider.max = total - 1;
        document.getElementById('lbl-total').innerText = total;

        const select = document.getElementById('page-select');
        select.innerHTML = "";
        
        for(let i=0; i<total; i++) {
            const opt = document.createElement("option");
            opt.value = i;
            let label = "";
            if (IS_COVER_MODE) {
                if(i===0) label = "表紙";
                else {
                    const start = 1 + (i-1)*2 + 1;
                    label = `P${start} - P${start+1}`;
                }
            } else {
                const start = i*2 + 1;
                label = `P${start} - P${start+1}`;
            }
            opt.innerText = label;
            select.appendChild(opt);
        }
    }

    function updateNavUI() {
        document.getElementById('seek-bar').value = currentSpreadIndex;
        document.getElementById('lbl-current').innerText = currentSpreadIndex + 1;
        document.getElementById('page-select').value = currentSpreadIndex;
    }

    function onSeek(val) {
        currentSpreadIndex = parseInt(val);
        renderSpread();
    }

    function jumpToPage(val) {
        currentSpreadIndex = parseInt(val);
        renderSpread();
    }

    function getSpreadPages(sIdx) {
        if (!IS_COVER_MODE) {
            const start = sIdx * 2;
            return [start, start + 1];
        } else {
            if (sIdx === 0) return [-1, 0];
            const start = 1 + (sIdx - 1) * 2;
            return [start, start + 1];
        }
    }

    function renderSpread() {
        const container = document.getElementById('spread-view');
        container.innerHTML = '';
        
        const pages = getSpreadPages(currentSpreadIndex);
        const containerW = document.getElementById('viewer-container').clientWidth;
        const containerH = document.getElementById('viewer-container').clientHeight;
        
        const spreadAspect = (pw * 2) / ph;
        const windowAspect = containerW / containerH;
        
        let drawH, drawW;
        if (windowAspect > spreadAspect) {
            drawH = containerH * 0.95;
            drawW = drawH * spreadAspect;
        } else {
            drawW = containerW * 0.95;
            drawH = drawW / spreadAspect;
        }
        
        const pxPerMm = (drawW / 2) / pw;
        container.style.width = `${drawW}px`;
        container.style.height = `${drawH}px`;

        pages.forEach((pIdx, i) => {
            const pageDiv = document.createElement('div');
            pageDiv.className = 'page';
            pageDiv.style.width = '50%';
            pageDiv.style.height = '100%';

            if (pIdx < 0 || pIdx >= PROJECT_DATA.pages.length) {
                pageDiv.style.background = 'transparent';
                container.appendChild(pageDiv);
                return;
            }

            const pageData = PROJECT_DATA.pages[pIdx];
            pageDiv.style.backgroundColor = pageData.background_color;

            const m = pageData.custom_margins || {
                top: PROJECT_DATA.margin_top, bottom: PROJECT_DATA.margin_bottom,
                inner: PROJECT_DATA.margin_inner, outer: PROJECT_DATA.margin_outer
            };
            
            const isLeftPage = (i === 0);
            const mt = m.top * pxPerMm;
            const mb = m.bottom * pxPerMm;
            const ml = (isLeftPage ? m.outer : m.inner) * pxPerMm;
            const mr = (isLeftPage ? m.inner : m.outer) * pxPerMm;
            
            const safeW = (drawW/2) - ml - mr;
            const safeH = drawH - mt - mb;
            const spacing = pageData.spacing_mm * pxPerMm;

            const rects = LAYOUT_DEFS[pageData.layout_name] || [];
            rects.forEach((r, rIdx) => {
                const [rx, ry, rw, rh] = r;
                const slotX = ml + rx * safeW + spacing/2;
                const slotY = mt + ry * safeH + spacing/2;
                const slotW = rw * safeW - spacing;
                const slotH = rh * safeH - spacing;
                
                if (slotW <= 0 || slotH <= 0) return;

                const slotDiv = document.createElement('div');
                slotDiv.className = 'photo-slot';
                slotDiv.style.left = `${slotX}px`;
                slotDiv.style.top = `${slotY}px`;
                slotDiv.style.width = `${slotW}px`;
                slotDiv.style.height = `${slotH}px`;
                
                const photo = pageData.photos.find(p => p.slot_index === rIdx);
                if (photo) {
                    const img = document.createElement('img');
                    img.src = photo.path;
                    img.className = 'photo-img';
                    if (photo.rotation) img.style.transform = `rotate(${photo.rotation}deg)`;
                    slotDiv.appendChild(img);
                } 
                pageDiv.appendChild(slotDiv);
            });

            pageData.texts.forEach(txt => {
                const tDiv = document.createElement('div');
                tDiv.className = 'text-item';
                tDiv.innerText = txt.text;
                tDiv.style.color = txt.color;
                tDiv.style.fontSize = `${txt.font_size * pxPerMm * 0.3}px`; 
                tDiv.style.fontFamily = txt.font_family;
                tDiv.style.left = `${txt.x_rel * 100}%`;
                tDiv.style.top = `${txt.y_rel * 100}%`;
                if (txt.rotation) tDiv.style.transform += ` rotate(${txt.rotation}deg)`;
                pageDiv.appendChild(tDiv);
            });

            const pNum = document.createElement('div');
            pNum.className = 'page-num';
            pNum.innerText = `- ${pIdx + 1} -`;
            pageDiv.appendChild(pNum);
            
            const shadow = document.createElement('div');
            shadow.className = 'page-shadow';
            pageDiv.appendChild(shadow);

            container.appendChild(pageDiv);
        });
        
        updateNavUI();
    }

    function nextSpread() {
        if (currentSpreadIndex < getTotalSpreads() - 1) {
            currentSpreadIndex++;
            renderSpread();
        }
    }

    function prevSpread() {
        if (currentSpreadIndex > 0) {
            currentSpreadIndex--;
            renderSpread();
        }
    }

    window.onload = init;
</script>
